# Deploys web/amore-app + docs/site (mdBook) to GitHub Pages on every push to main.
# Fully agent-autonomous: uses ambient GITHUB_TOKEN, no external accounts or paid services.
# Layout:
#   /        -> web/amore-app/out (marketing landing)
#   /docs/   -> docs/site/book (mdBook user manual; closes tier-e-6-hosted-docs known_gap)
# Result: https://antonio-amore-akiki.github.io/amore/ + .../amore/docs/
name: web-deploy

on:
  push:
    branches: [main]
    paths:
      - "web/amore-app/**"
      - "docs/site/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/amore-app
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/amore-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Install mdBook
        working-directory: ${{ github.workspace }}
        run: |
          MDBOOK_VERSION=0.4.40
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory=/usr/local/bin

      - name: Build mdBook (user manual)
        working-directory: ${{ github.workspace }}/docs/site
        run: mdbook build

      - name: Assemble combined Pages artifact
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p _site
          cp -r web/amore-app/out/. _site/
          mkdir -p _site/docs
          cp -r docs/site/book/. _site/docs/
          echo "[docs-deploy] _site assembled: $(find _site -maxdepth 2 -type d | sort | head -20)"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
